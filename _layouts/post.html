---
layout: default
---

<div class="post-container">
    <header class="post-header">
        <a href="{{ '/' | relative_url }}" class="back-link">← 목록으로</a>
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            <time>{{ page.date | date: "%Y년 %m월 %d일" }}</time>
            {% if page.paper_info %}
            <div class="paper-info">{{ page.paper_info }}</div>
            {% endif %}
        </div>
    </header>
    
    <article class="post-content">
        {{ content }}
    </article>
</div>
